[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-smartsim"
version = "0.1.0"
description = "Articulation annotations as an agent tool interface: an LLM-agent harness for articulated object manipulation, with a LIBERO control arm."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LianYi233" }]
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
api = ["openai>=1.30"]
libero = ["robosuite", "bddl", "libero"]
dev = ["pytest>=7.0"]

[project.scripts]
agent-smartsim = "agent_smartsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
